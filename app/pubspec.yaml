name: araragov
description: "Dados públicos de políticos brasileiros, organizados e fáceis de entender."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  http: ^1.6.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/mascote/
    - assets/icone/
    - assets/amostra/v1/
    - assets/amostra/v1/politicos/

flutter_launcher_icons:
  image_path: "assets/icone/araragov.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icone/araragov-arredondado.png"
  windows:
    generate: true
    image_path: "assets/icone/araragov-arredondado.png"
  macos:
    generate: true
    image_path: "assets/icone/araragov-arredondado.png"
