name: Sondagem estados
on:
  push:
    branches: [etapa-3-estados]
    paths: [".github/workflows/sondagem-estados.yml"]
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Sondar fontes
        run: |
          set +e
          ua="AraraGov/0.1 (+https://github.com/Githyot/AraraGov)"
          get() { echo "=== $1"; curl -sSL -A "$ua" --max-time 120 -o /tmp/r -w "HTTP %{http_code} %{content_type} %{size_download}B\n" "$1"; head -c ${2:-1500} /tmp/r | tr -d '\r'; echo; }
          get "https://dadosabertos.almg.gov.br/ws/deputados/12193?formato=json" 3000
          for u in prestacao_contas/verbas_indenizatorias/deputados/12193/2025/3 prestacao_contas/verbas_indenizatorias/legislatura_atual/deputados/12193/2025/3 prestacao_contas/verbas_indenizatorias/deputados/12193/datas prestacao_contas/verbas_indenizatorias/legislatura_atual/deputados/12193/datas; do get "https://dadosabertos.almg.gov.br/ws/$u?formato=json" 1500; done
          curl -sSL -A "$ua" "https://www.al.sp.gov.br/repositorioDados/deputados/deputados.xml" | python3 -c "import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); d=r[0]; print(len(r)); [print(c.tag, (c.text or '')[:80].replace(chr(10),' ')) for c in d if c.tag!='Biografia']; print([ (x.findtext('Situacao')) for x in r][:60])"
          curl -sSL -A "$ua" --max-time 240 "https://www.al.sp.gov.br/repositorioDados/deputados/despesas_gabinetes.xml" -o /tmp/d.xml -w "HTTP %{http_code} %{size_download}B %{time_total}s\n"
          python3 -c "
import xml.etree.ElementTree as E, collections
c=collections.Counter(); tags=set(); last=None
for ev,el in E.iterparse('/tmp/d.xml'):
    if el.tag=='despesa':
        tags|={x.tag for x in el}; c[el.findtext('Ano')]+=1; last=E.tostring(el)[:600]; el.clear()
print(sorted(tags)); print(sorted(c.items())); print(last)
"
          exit 0
