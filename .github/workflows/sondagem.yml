name: Sondagem de fontes

# Temporário: confere, a partir do GitHub, fontes novas fora da fila da coleta.
# Roda só em PR quando este arquivo muda.

on:
  pull_request:
    paths: [".github/workflows/sondagem.yml"]

jobs:
  sondar:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: TCE-PE, lista de entidades e códigos dos municípios
        run: |
          set +e
          A="AraraGov (dados publicos; github.com/Githyot/AraraGov)"
          B="https://sistemas.tce.pe.gov.br/DadosAbertos"
          curl -sS -m 60 -A "$A" "$B/" -o /tmp/i.html -w "[indice %{http_code} %{size_download}B]\n"
          iconv -f latin1 -t utf-8 /tmp/i.html | grep -o '[A-Za-z]*![a-z]*' | sort -u | head -150
          for e in UnidadesJurisdicionadas MunicipiosPE MunicipiosPernambuco UnidadeJurisdicionada Entidades; do
            curl -sS -m 120 -A "$A" "$B/$e!json" -o /tmp/e.json -w "[$e %{http_code} %{size_download}B]\n"
            head -c 700 /tmp/e.json | iconv -f latin1 -t utf-8; echo
          done
      - name: AgiliCloud com o corpo completo
        run: |
          set +e
          cat > /tmp/s.py <<'PY'
          import json, sys, time
          sys.path.insert(0, ".")
          from araragov.http import HttpClient
          from araragov.municipios import agili
          c = HttpClient(tentativas=2)
          ps = agili.prefeituras(c)
          print(len(ps), "prefeituras com IBGE:", ps)
          for uf, cod, curto in ps[:3]:
              for tam in (1000, 500):
                  t = time.time()
                  try:
                      d = c.pedir_json("POST", agili.GRID.format(pagina=0, tamanho=tam), agili._corpo(2025),
                                       {"uc": curto, "Content-Type": "application/json; charset=utf-8"})
                      print(curto, tam, "total", d.get("totalResult"), "linhas", len(d.get("data") or []), f"{time.time()-t:.1f}s")
                  except Exception as e:
                      print(curto, tam, "erro", str(e)[:300])
          PY
          pip install -q -e . >/dev/null 2>&1; python /tmp/s.py
