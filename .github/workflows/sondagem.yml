name: Sondagem de fontes

# Temporário: confere, a partir do GitHub, fontes novas fora da fila da coleta.
# Roda só em PR quando este arquivo muda.

on:
  pull_request:
    paths: [".github/workflows/sondagem.yml"]

jobs:
  sondar:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: TCE-PE, campos e filtros das despesas municipais
        run: |
          set +e
          A="AraraGov (dados publicos; github.com/Githyot/AraraGov)"
          U="https://sistemas.tce.pe.gov.br/DadosAbertos/DespesasMunicipais!json"
          for q in "ANOREFERENCIA=2025&CODIGO_MUNICIPIO=P120&MES=3" "ANOREFERENCIA=2025&CODIGOMUNICIPIO=P120&MES=3" "ANOREFERENCIA=2025&MUNICIPIO=Garanhuns&MESREFERENCIA=3"; do
            curl -sS -m 300 -A "$A" "$U?$q" -o /tmp/pe.json -w "[$q %{http_code} %{size_download}B %{time_total}s]\n"
            python3 -c "
          import json,collections
          d=json.loads(open('/tmp/pe.json','rb').read().decode('latin-1'))['resposta']
          c=d.get('conteudo') or []
          print(d.get('status'), d.get('tamanhoResultado'), len(c))
          if c:
              print(sorted(c[0].keys()))
              print(collections.Counter(x.get('CODIGO_MUNICIPIO') for x in c).most_common(3))
              print(collections.Counter(x.get('MES') or x.get('MESREFERENCIA') for x in c).most_common(13))
              print(collections.Counter(len((x.get('CPF_CNPJ') or '').strip()) for x in c).most_common())
              print(json.dumps(c[0], ensure_ascii=False)[:1500])"
          done
          curl -sS -m 60 -A "$A" "https://sistemas.tce.pe.gov.br/DadosAbertos/Municipios!json" -o /tmp/m.json -w "[Municipios %{http_code} %{size_download}B]\n"
          head -c 800 /tmp/m.json | iconv -f latin1 -t utf-8; echo
      - name: AgiliCloud, total de empenhos de um ano
        run: |
          set +e
          A="AraraGov (dados publicos; github.com/Githyot/AraraGov)"
          B=https://transparencia.agilicloud.com.br/api
          echo '[{"field":"FiltroExercicio","label":"Exercício","nameFieldTable":"","aliasTable":"E","type":1,"typeParam":1,"operatorDefault":1,"operatorValue":1,"checked":true,"order":100,"required":true,"value":"2025"}]' > /tmp/corpo.json
          for uc in prefguarantanorte-mt prefcarlinda-mt; do
            curl -sS -m 120 -A "$A" -H "Accept: application/json" -H "Content-Type: application/json; charset=utf-8" -H "uc: $uc" -X POST --data @/tmp/corpo.json \
              "$B/contabilidade/despesas/empenhosporexercicio/obterdadosempenhosporexercicio/?model=Agili.Blue.Portal.Shared.Contabilidade.Dto.Despesas.EmpenhosPorExercicio.EmpenhosPorExercicioGridDto&page=0&size=1000&withCount=true" \
              -o /tmp/g.json -w "[$uc %{http_code} %{size_download}B %{time_total}s]\n"
            python3 -c "
          import json
          d=json.load(open('/tmp/g.json'))
          r=d.get('data') or []
          print('total', d.get('totalResult'), 'nesta página', len(r))
          if r: print(json.dumps(r[0], ensure_ascii=False)[:1200])"
          done
      - name: Querido Diário (com redirecionamento)
        run: |
          set +e
          A="AraraGov (dados publicos; github.com/Githyot/AraraGov)"
          curl -sSL -m 60 -A "$A" "https://queridodiario.ok.org.br/api/gazettes?querystring=%2200.360.305%2F0001-04%22&size=2" -o /tmp/q.json -w "[qd %{http_code} %{size_download}B %{url_effective}]\n"
          head -c 1500 /tmp/q.json; echo
