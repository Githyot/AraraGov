name: Sondagem de fontes

# Temporário: confere, a partir do GitHub, o formato de fontes novas antes de
# escrever o coletor (tentativa 3). Roda só em PR, fora da fila da coleta.

on:
  pull_request:
    paths: [".github/workflows/sondagem.yml"]

jobs:
  sondar-estados:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: TCE-PB (novo portal)
        if: always()
        run: |
          set +e
          A="AraraGov (dados publicos)"; H="https://dados-abertos.tce.pb.gov.br"
          curl -sS --retry 4 --retry-all-errors --retry-delay 10 -m 60 -A "$A" "$H/" -o /tmp/pb.html -w '[%{http_code} %{size_download}B]\n'; head -c 1200 /tmp/pb.html; echo
          for js in $(grep -o '/assets/[^"]*\.js' /tmp/pb.html | sort -u); do
            echo "== $js"; curl -sS -m 60 -A "$A" "$H$js" | grep -o '"[^"]*\(api\|\.gz\|\.zip\|\.csv\|download\|sagres\|Sagres\)[^"]*"' | sort -u | head -80
          done
          js=$(grep -o '/assets/[^"]*\.js' /tmp/pb.html | head -1); curl -sS -m 60 -A "$A" "$H$js" -o /tmp/pb.js
          echo "== ids"; grep -o 'id:"[a-z0-9_-]*"[^}]\{0,200\}' /tmp/pb.js | head -80
          echo "== em volta de dados-consolidados"; grep -o '.\{1500\}dados-consolidados.\{300\}' /tmp/pb.js | head -c 4000; echo
          for id in despesas receitas; do
            for ano in 2024 2025; do
              u="https://download.tce.pb.gov.br/dados-abertos/dados-consolidados/$id/$id-$ano.zip"
              curl -sS -I -m 60 -A "$A" "$u" | grep -i "^HTTP\|content-length\|last-modified" | tr '\n' ' '; echo " $u"
            done
          done
          u="https://download.tce.pb.gov.br/dados-abertos/dados-consolidados/despesas/despesas-2025.zip"
          curl -sS -m 120 -A "$A" -r 0-400000 "$u" -o /tmp/p.zip; python3 - <<'PY'
          import zlib
          b=open('/tmp/p.zip','rb').read()
          import struct
          if b[:4]==b'PK\x03\x04':
              n=struct.unpack('<H',b[26:28])[0]; e=struct.unpack('<H',b[28:30])[0]; met=struct.unpack('<H',b[8:10])[0]
              print('arquivo:', b[30:30+n].decode('latin-1'), 'metodo', met)
              d=zlib.decompressobj(-15).decompress(b[30+n+e:]) if met==8 else b[30+n+e:]
              print(d[:6000].decode('latin-1'))
          else:
              print(b[:500])
          PY
