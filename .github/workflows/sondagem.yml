name: Sondagem de fontes

# Temporário: confere, a partir do GitHub, fontes novas fora da fila da coleta.
# Roda só em PR quando este arquivo muda.

on:
  pull_request:
    paths: [".github/workflows/sondagem.yml"]

jobs:
  testar-tces:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Outros tribunais (RN, PI, RJ, TO, MT, MS, AL, AM)
        run: |
          set +e
          A="AraraGov (dados publicos)"
          g(){ echo "== $1"; curl -sS -L -m 60 -A "$A" -w '\n[%{http_code} %{size_download}B]\n' "$1" | head -c ${2:-1500}; echo; }
          g "https://apidadosabertos.tce.rn.gov.br/swagger/docs/v1" 200
          curl -sS -m 60 -A "$A" "https://apidadosabertos.tce.rn.gov.br/swagger/docs/v1" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(p) for p in d.get('paths',{})]" | head -80
          g "https://apidadosabertos.tce.rn.gov.br/api/InformacoesBasicasApi/JurisdicionadosTCE/Json" 800
          g "https://sistemas.tce.pi.gov.br/api/portaldacidadania/prefeituras" 600
          id=$(curl -sS -m 60 -A "$A" https://sistemas.tce.pi.gov.br/api/portaldacidadania/prefeituras | python3 -c "import json,sys;d=json.load(sys.stdin);print(d[0].get('id') or d[0])" 2>/dev/null)
          echo "id=$id"; g "https://sistemas.tce.pi.gov.br/api/portaldacidadania/credores/$id/2024" 1500
          g "https://dados.tcerj.tc.br/api/v1/contratos_municipio?limite=2" 2500
          g "https://dados.tcerj.tc.br/api/v1/compras_diretas_municipio?limite=2" 2000
          g "https://dados.tcerj.tc.br/api/v1/" 1500
          g "https://portaldocidadao.tce.to.gov.br/estadomunicipios/index" 600
          g "https://dadosabertos.tce.mt.gov.br/" 600
          g "https://www.tce.ms.gov.br/portal-transparencia/" 300
          g "https://dados.tce.al.gov.br/" 300
          g "https://www2.tce.am.gov.br/" 300
      - name: TCE-CE (6 municípios, 3 meses)
        if: false
        run: |
          python -m araragov tce-ce --saida site --anos 2025 --limite-municipios 6 --meses 3
          ls site/v1/municipios/ce/
          f=$(ls site/v1/municipios/ce/*/2025-pagamentos.md | head -1); head -45 "$f"; grep -A6 "tabela: obras" "$f" || true
      - name: TCE-PB (300 mil linhas)
        if: false
        run: |
          python -m araragov tce-pb --saida site --anos 2025 --limite-linhas 300000
          ls site/v1/municipios/pb/ | wc -l
          f=$(ls site/v1/municipios/pb/*/2025-pagamentos.md | head -1); head -45 "$f"; grep -A6 "tabela: obras" "$f" || true
          curl -sS -m 300 -A "AraraGov (dados publicos)" https://download.tce.pb.gov.br/dados-abertos/dados-consolidados/despesas/despesas-2025.zip -o /tmp/pb.zip
          unzip -p /tmp/pb.zip | head -200000 | cut -d';' -f11 | awk '/,/{v++} /^[0-9]+\.[0-9]+$/{p++} END{print "virgula",v,"so_ponto",p}'
          unzip -p /tmp/pb.zip | head -200000 | cut -d';' -f11 | grep ',' | head -5
