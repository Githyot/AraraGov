name: Sondagem de fontes

# Temporário: confere, a partir do GitHub, fontes novas fora da fila da coleta.
# Roda só em PR quando este arquivo muda.

on:
  pull_request:
    paths: [".github/workflows/sondagem.yml"]

jobs:
  testar-tces:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: TCE-RN (empenhos) e TCE-RJ (contratos)
        run: |
          set +e
          A="AraraGov (dados publicos)"; R="https://apidadosabertos.tce.rn.gov.br/api"
          curl -sS -m 90 -A "$A" "$R/InformacoesBasicasApi/JurisdicionadosTCE/Json" -o /tmp/j.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/j.json'))
          print(len(d),'unidades')
          pm=[u for u in d if 'PREFEITURA' in (u['nomeOrgao'] or '').upper()]
          print(len(pm),'prefeituras'); print(pm[:3])
          import collections
          print(collections.Counter((u['nomeOrgao'] or '').split(' DE ')[0] for u in d).most_common(15))
          open('/tmp/pm','w').write(str([u for u in pm if 'MOSSOR' in u['nomeOrgao'].upper()][0]['identificadorUnidade']))
          PY
          id=$(cat /tmp/pm); echo "Mossoro=$id"
          curl -sS -m 180 -A "$A" "$R/EmpenhosLiquidacoesPagamentosApi/Empenhos/Json/2024/$id" -o /tmp/e.json -w '[%{http_code} %{size_download}B %{time_total}s]\n'
          python3 -c "import json;d=json.load(open('/tmp/e.json'));print(type(d), len(d));print(json.dumps(d[:2],ensure_ascii=False,indent=1)[:3000])"
          curl -sS -m 180 -A "$A" "$R/ContratosApi/Contratos/Json/$id/false" | head -c 2000; echo
          echo "== RJ contratos"
          curl -sS -m 240 -A "$A" "https://dados.tcerj.tc.br/api/v1/contratos_municipio?ano=2024&municipio=MACAE&limite=2" -w '\n[%{http_code} %{time_total}s]\n' | head -c 3000; echo
      - name: TCE-CE (6 municípios, 3 meses)
        if: false
        run: |
          python -m araragov tce-ce --saida site --anos 2025 --limite-municipios 6 --meses 3
          ls site/v1/municipios/ce/
          f=$(ls site/v1/municipios/ce/*/2025-pagamentos.md | head -1); head -45 "$f"; grep -A6 "tabela: obras" "$f" || true
      - name: TCE-PB (300 mil linhas)
        if: false
        run: |
          python -m araragov tce-pb --saida site --anos 2025 --limite-linhas 300000
          ls site/v1/municipios/pb/ | wc -l
          f=$(ls site/v1/municipios/pb/*/2025-pagamentos.md | head -1); head -45 "$f"; grep -A6 "tabela: obras" "$f" || true
          curl -sS -m 300 -A "AraraGov (dados publicos)" https://download.tce.pb.gov.br/dados-abertos/dados-consolidados/despesas/despesas-2025.zip -o /tmp/pb.zip
          unzip -p /tmp/pb.zip | head -200000 | cut -d';' -f11 | awk '/,/{v++} /^[0-9]+\.[0-9]+$/{p++} END{print "virgula",v,"so_ponto",p}'
          unzip -p /tmp/pb.zip | head -200000 | cut -d';' -f11 | grep ',' | head -5
