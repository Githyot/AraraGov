name: Sondagem de fontes

# Temporário: confere, a partir do GitHub, fontes novas fora da fila da coleta.
# Roda só em PR quando este arquivo muda.

on:
  pull_request:
    paths: [".github/workflows/sondagem.yml"]

jobs:
  sondar:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: TCE-PE, empenho repetido entre meses?
        run: |
          set +e
          A="AraraGov (dados publicos; github.com/Githyot/AraraGov)"
          U="https://sistemas.tce.pe.gov.br/DadosAbertos/DespesasMunicipais!json"
          for q in "ANOREFERENCIA=2024&CODIGO_MUNICIPIO=P001" "ANOREFERENCIA=2019&CODIGO_MUNICIPIO=P001" "ANOREFERENCIA=2026&CODIGO_MUNICIPIO=P001"; do
            curl -sS -m 300 -A "$A" "$U?$q" -o /tmp/pe.json -w "[$q %{http_code} %{size_download}B %{time_total}s]\n"
            python - <<'PY'
          import json, collections
          d = json.loads(open('/tmp/pe.json', 'rb').read().decode('latin-1'))['resposta']
          c = d.get('conteudo') or []
          print(d.get('status'), len(c))
          por = collections.defaultdict(list)
          for x in c:
              por[(x['ID_EMPENHO'].strip(), x['ID_UNIDADE_GESTORA'])].append(x)
          rep = [v for v in por.values() if len(v) > 1]
          print('empenhos', len(por), 'repetidos', len(rep))
          for v in rep[:3]:
              print([(x['MESREFERENCIA'], x['VALOREMPENHADO'], x['VALORLIQUIDADO'], x['VALORPAGO'], x['DATAEMPENHO'][:10]) for x in v])
          print(collections.Counter(x['ELEMENTODESPESA'] for x in c).most_common(40))
          print(collections.Counter((x['CATEGORIA'], x['NATUREZA']) for x in c).most_common(12))
          print(collections.Counter(x['TIPOCREDOR'] for x in c), collections.Counter((x['TIPOCREDOR'], len(x['CPF_CNPJ'].strip())) for x in c))
          print([x['CPF_CNPJ'] for x in c if len(x['CPF_CNPJ'].strip()) != 14][:3])
          PY
          done
