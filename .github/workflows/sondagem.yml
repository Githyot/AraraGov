name: Sondagem de fontes

# Temporário: confere, a partir do GitHub, fontes novas fora da fila da coleta.
# Roda só em PR quando este arquivo muda.

on:
  pull_request:
    paths: [".github/workflows/sondagem.yml"]

jobs:
  sondar:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: AgiliCloud (portais de prefeituras do MT, sistema IPM/Agili)
        run: |
          set +e
          A="AraraGov (dados publicos; github.com/Githyot/AraraGov)"
          B=https://transparencia.agilicloud.com.br/api
          curl -sS -m 60 -A "$A" -H "Accept: application/json" -H "uc: prefguarantanorte-mt" "$B/seletor/get" -o /tmp/cli.json -w "[seletor %{http_code} %{size_download}B %{time_total}s]\n"
          python3 -c "
          import json,collections
          d=json.load(open('/tmp/cli.json'))
          print(len(d), 'clientes'); print(collections.Counter(c.get('uf') for c in d).most_common())
          pref=[c for c in d if 'pref' in (c.get('shortname') or '')]
          print(len(pref), 'prefeituras'); print([ (c.get('shortname'), c.get('nomeRazaoSocial')) for c in pref[:5]])
          print(sorted(d[0].keys()))"
          cat > /tmp/corpo.json <<'JSON'
          [{"field":"FiltroExercicio","label":"Exercício","nameFieldTable":"","aliasTable":"E","type":1,"typeParam":1,"operatorDefault":1,"operatorValue":1,"checked":true,"order":100,"required":true,"value":"2025"},
           {"field":"DataInicio","label":"De","nameFieldTable":"DataEmpenho","aliasTable":"E","type":3,"typeParam":3,"operatorDefault":1,"operatorValue":1,"checked":true,"order":50,"required":false,"value":"2025-01-01","valueFinnaly":"2025-12-31"},
           {"field":"DataFim","label":"Até","nameFieldTable":"DataEmpenho","aliasTable":"E","type":3,"typeParam":3,"operatorDefault":1,"operatorValue":1,"checked":true,"order":50,"required":false,"value":"2025-12-31"}]
          JSON
          curl -sS -m 120 -A "$A" -H "Accept: application/json" -H "Content-Type: application/json; charset=utf-8" -H "uc: prefguarantanorte-mt" \
            -X POST --data @/tmp/corpo.json \
            "$B/contabilidade/despesas/empenhosporexercicio/obterdadosempenhosporexercicio/?model=Agili.Blue.Portal.Shared.Contabilidade.Dto.Despesas.EmpenhosPorExercicio.EmpenhosPorExercicioGridDto&page=0&size=3&withCount=true" \
            -o /tmp/g.json -w "[grid %{http_code} %{size_download}B %{time_total}s]\n"
          head -c 3000 /tmp/g.json; echo
      - name: TCE-PE (dados abertos, despesas municipais)
        run: |
          set +e
          A="AraraGov (dados publicos; github.com/Githyot/AraraGov)"
          curl -sS -m 60 -A "$A" "https://sistemas.tce.pe.gov.br/DadosAbertos/" -o /tmp/pe.html -w "[índice %{http_code} %{size_download}B]\n"
          sed 's/<[^>]*>/ /g' /tmp/pe.html | tr -s ' \n' | grep -oiE "[A-Za-z]*(Municip|Despesa|Empenho|Pagamento|Contrato|Licita)[A-Za-z]*" | sort | uniq -c | sort -rn | head -40
          for r in DespesasMunicipais EmpenhosMunicipais PagamentosMunicipais ContratosMunicipais; do
            curl -sS -m 120 -A "$A" "https://sistemas.tce.pe.gov.br/DadosAbertos/$r!json?ANOREFERENCIA=2025&MUNICIPIO=RECIFE" -o /tmp/r.json -w "[$r %{http_code} %{size_download}B %{time_total}s]\n"
            head -c 600 /tmp/r.json | iconv -f latin1 -t utf-8; echo
          done
      - name: Querido Diário (diários oficiais municipais)
        run: |
          set +e
          A="AraraGov (dados publicos; github.com/Githyot/AraraGov)"
          curl -sS -m 60 -A "$A" "https://queridodiario.ok.org.br/api/gazettes?querystring=%2200.360.305%2F0001-04%22&size=3" -o /tmp/q.json -w "[qd %{http_code} %{size_download}B %{time_total}s]\n"
          head -c 1500 /tmp/q.json; echo
          curl -sS -m 60 -A "$A" "https://queridodiario.ok.org.br/api/cities?levels=3" -o /tmp/c.json -w "[cidades %{http_code} %{size_download}B]\n"
          python3 -c "import json;d=json.load(open('/tmp/c.json'));c=d.get('cities',d);print(len(c),'cidades com diário completo')"
