name: Sondagem de fontes

# Temporário: confere, a partir do GitHub, fontes novas fora da fila da coleta.
# Roda só em PR quando este arquivo muda.

on:
  pull_request:
    paths: [".github/workflows/sondagem.yml", "araragov/municipios/fiorilli.py"]

jobs:
  fiorilli:
    # Procura os portais Fiorilli das prefeituras e mostra os campos de um portal conhecido.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Campos de DespesasGerais
        run: |
          set +e
          curl -sS -m 120 -A "AraraGov/0.1 (+https://github.com/Githyot/AraraGov)" "http://scpi3.adtrcloud.com.br:8079/Transparencia/VersaoJson/Despesas/?Listagem=DespesasGerais&DiaInicioPeriodo=01&MesInicialPeriodo=01&DiaFinalPeriodo=31&MesFinalPeriodo=01&Exercicio=2025&ConectarExercicio=2025&Ano=2025&Empresa=1&MostrarFornecedor=True&MostrarCNPJFornecedor=True&MostraDadosConsolidado=True&UFParaFiltroCOVID=&ApenasIDEmpenho=False" -o /tmp/g.json
          python -c "
          import json, collections
          d = json.load(open('/tmp/g.json'))
          print(type(d).__name__, len(d))
          r = d[0] if isinstance(d, list) else d
          print(sorted(r.keys()) if isinstance(r, dict) else r)
          print(collections.Counter(x.get('nomeempresa') or x.get('NOMEEMPRESA') for x in d).most_common(5))
          x = dict(r); [x.pop(k) for k in list(x) if 'cpf' in k.lower()]
          print(json.dumps(x, ensure_ascii=False)[:1500])"
      - run: python -m araragov fiorilli-descobrir --ufs GO,MG,PR,RS,MS,TO,SC,BA,ES,MA,PI,RN,AL,SE,RJ,AM,PA,AP,RR,RO,AC --saida /tmp/fiorilli.csv
      - run: cat /tmp/fiorilli.csv; grep -vc '^#' /tmp/fiorilli.csv

  sondar:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Cabeçalhos dos arquivos brutos (ETag, Last-Modified)
        run: |
          set +e
          A="AraraGov (dados publicos; github.com/Githyot/AraraGov)"
          for u in \
            "https://transparencia.tce.sp.gov.br/sites/default/files/conjunto-dados/despesas-2026.zip" \
            "https://download.tce.pb.gov.br/dados-abertos/dados-consolidados/despesas/despesas-2026.zip" \
            "https://cdn.tse.jus.br/estatistica/sead/odsele/prestacao_contas/prestacao_de_contas_eleitorais_candidatos_2024.zip" ; do
            echo "== $u"; curl -sSI -L -m 60 -A "$A" "$u" | grep -iE "^(HTTP|etag|last-modified|content-length)"
          done
      - name: Senado, votações de um período sem filtrar por senador
        run: |
          set +e
          A="AraraGov (dados publicos; github.com/Githyot/AraraGov)"
          curl -sS -m 120 -A "$A" -H "Accept: application/json" \
            "https://legis.senado.leg.br/dadosabertos/votacao?dataInicio=2025-03-01&dataFim=2025-03-31&v=1" -o /tmp/s.json \
            -w "[%{http_code} %{size_download}B %{time_total}s]\n"
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/s.json"))
          lista = d if isinstance(d, list) else next((v for v in d.values() if isinstance(v, list)), d)
          print(type(d).__name__, "itens:", len(lista) if isinstance(lista, list) else "?")
          if isinstance(lista, list) and lista:
              e = lista[0]
              print("chaves:", sorted(e.keys())[:40])
              votos = e.get("votos") or e.get("Votos") or []
              print("votos na primeira:", len(votos))
              print("votos por votação:", [len(x.get("votos") or x.get("Votos") or []) for x in lista[:15]])
          PY
