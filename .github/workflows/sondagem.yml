name: Sondagem de fontes

# Temporário: confere, a partir do GitHub, o formato de fontes novas antes de
# escrever o coletor. Roda só em PR, fora da fila da coleta.

on:
  pull_request:
    paths: [".github/workflows/sondagem.yml"]

jobs:
  sondar-estados:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: TCE-CE (contratos e obras, formato da data)
        run: |
          A="AraraGov (dados publicos)"; B="https://api-dados-abertos.tce.ce.gov.br/sim"
          for d in "01/01/2025|31/03/2025" "20250101|20250331" "2025-01-01T00:00:00|2025-03-31T00:00:00" "2025-01-01 00:00:00|2025-03-31 00:00:00"; do
            i="${d%%|*}"; f="${d##*|}"
            echo "== datas $i"
            curl -sS -m 60 -A "$A" -G "$B/contratos" --data-urlencode "codigo_municipio=049" --data-urlencode "data_inicio=$i" \
              --data-urlencode "data_fim=$f" --data-urlencode '$count=2' -w '\n[%{http_code}]\n' | head -c 2500; echo
          done
          curl -sS -m 60 -A "$A" -G "$B/obras_municipais_servicos_engenharia" --data-urlencode "codigo_municipio=049" \
            --data-urlencode "exercicio_orcamento=202500" --data-urlencode '$count=2' -w '\n[%{http_code}]\n' | head -c 2500; echo
      - name: TCE-PB (novo portal)
        if: always()
        run: |
          A="AraraGov (dados publicos)"; H="https://dados-abertos.tce.pb.gov.br"
          curl -sS -m 60 -A "$A" "$H/" -o /tmp/pb.html -w '[%{http_code} %{size_download}B]\n'; head -c 1200 /tmp/pb.html; echo
          for js in $(grep -o '/assets/[^"]*\.js' /tmp/pb.html | sort -u); do
            echo "== $js"; curl -sS -m 60 -A "$A" "$H$js" | grep -o '"[^"]*\(api\|\.gz\|\.zip\|\.csv\|download\|sagres\|Sagres\)[^"]*"' | sort -u | head -80
          done
          curl -sS -I -m 60 -A "$A" "$H/TCE-PB-SAGRES-Pagamentos_Esfera_Municipal.txt.gz" | head -10
