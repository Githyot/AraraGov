name: App

# Testes rodam em todo PR. Os executáveis (Android, Linux, Web, Windows,
# iOS e macOS) só são gerados quando alguém pede: Actions → App → Run workflow.

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-linux-web:
    needs: testes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter build apk --release
      - run: flutter build linux --release
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: araragov-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: araragov-linux
          path: app/build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: araragov-web
          path: app/build/web

  windows:
    needs: testes
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: araragov-windows
          path: app/build/windows/x64/runner/Release

  ios-macos:
    needs: testes
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Sem assinatura: prova que compila. Publicar na App Store exige conta Apple Developer.
      - run: flutter build ios --release --no-codesign
      - run: flutter build macos --release
