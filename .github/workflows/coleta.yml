name: Coleta de dados

# Roda os coletores contra as fontes oficiais.
# - Em pull requests: amostra pequena, para provar que as fontes ainda respondem
#   no formato esperado.
# - Toda segunda-feira e sob demanda: coleta completa, publicada no GitHub Pages; o banco
#   SQLite fica disponível como artefato da execução.
on:
  pull_request:
    paths: ["araragov/**", "scripts/coleta/**", ".github/workflows/coleta.yml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano ou intervalo, ex.: 2025 ou 2019-2026 (vazio = 2019 até hoje)"
        required: false
      limite:
        description: "Limite de itens por fonte (vazio = tudo)"
        required: false
      republicar:
        description: "Só publicar o site já montado por outra execução (número da execução; vazio = coletar)"
        required: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# A coleta completa nunca roda em paralelo consigo mesma (publica no Pages);
# cada PR tem sua própria fila, para um não cancelar a coleta de outro.
env:
  # Anos fechados já publicados não são baixados de novo (araragov/municipios/publicados.py).
  ARARAGOV_REAPROVEITAR: ${{ github.event_name == 'pull_request' && '0' || '1' }}
  EVENTO: ${{ github.event_name }}
  # Saída com IP brasileiro para portais que recusam IP estrangeiro (araragov/http.py).
  # Sem os secrets cadastrados ficam vazias e nada muda.
  ARARAGOV_PROXY_BR: ${{ secrets.ARARAGOV_PROXY_BR }}
  ARARAGOV_PROXY_HOSTS: ${{ secrets.ARARAGOV_PROXY_HOSTS }}

concurrency:
  group: coleta-${{ github.event_name == 'pull_request' && github.ref || 'completa' }}
  cancel-in-progress: false

jobs:
  # Cada fonte roda numa máquina própria, ao mesmo tempo; o tempo total é o da mais lenta.
  # 1) federal, base (eleitos e custos) e Siconfi; 2) tribunais, PNCP e emendas, que leem a
  # base; 3) fornecedores, que lê tudo; 4) montar junta os pedaços e publica.
  # Os scripts de cada fonte ficam em scripts/coleta/; em PRs rodam só uma amostra.
  federal:
    if: ${{ !inputs.republicar }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Câmara, Senado e assembleias
        timeout-minutes: 180
        env:
          ANO_IN: ${{ inputs.ano }}
          LIMITE_IN: ${{ inputs.limite }}
        run: scripts/coleta/federal.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: site-federal
          path: site
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: araragov-db
          path: dados/araragov.db
          if-no-files-found: ignore
          retention-days: 30

  base:
    # Quem governa (lido pelos pagamentos) e os custos de referência (lidos pelos contratos).
    if: ${{ !inputs.republicar }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Prefeitos e vereadores (TSE)
        timeout-minutes: 60
        run: scripts/coleta/eleitos.sh
      - name: Custos de referência (SIDRA, IPCA e tabelas curadas)
        timeout-minutes: 20
        if: ${{ !cancelled() }}
        run: scripts/coleta/custos.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: site-base
          path: site
          if-no-files-found: ignore
          retention-days: 3

  siconfi:
    if: ${{ !inputs.republicar }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Arrecadação e gastos por área (Siconfi)
        timeout-minutes: 180
        run: scripts/coleta/siconfi.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: site-siconfi
          path: site
          if-no-files-found: ignore
          retention-days: 3

  municipais:
    needs: base
    if: ${{ !cancelled() && !inputs.republicar }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        fonte: [tce-sp, tce-ce, tce-pb, tce-pe, tce-rj, agili, pncp, emendas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: site-base
          path: site
      - name: ${{ matrix.fonte }}
        timeout-minutes: 220
        run: scripts/coleta/${{ matrix.fonte }}.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: site-${{ matrix.fonte }}
          path: site
          if-no-files-found: ignore
          retention-days: 3

  fornecedores:
    # Cruza as empresas que receberam (pagamentos, contratos e emendas) com o CEIS/CNEP e o TSE.
    needs: [base, municipais]
    if: ${{ !cancelled() && !inputs.republicar }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          merge-multiple: true
          path: site
      - name: Fornecedores dos municípios (CEIS/CNEP e campanhas no TSE)
        timeout-minutes: 100
        run: scripts/coleta/fornecedores.sh
      - name: Lista de empresas no log (para a coleta local de sócios)
        # O download de artefatos não passa pela rede do ambiente do mantenedor;
        # o log passa. Cada linha sai como "CNPJ-FORNECEDOR <14 dígitos>".
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          f=site/v1/municipios/cnpjs-fornecedores.txt
          if [ -f "$f" ]; then wc -l "$f"; sed 's/^/CNPJ-FORNECEDOR /' "$f"; fi
      - uses: actions/upload-artifact@v4
        # Lista de CNPJs para a coleta local de sócios (araragov coleta-local).
        if: ${{ !cancelled() }}
        with:
          name: cnpjs-fornecedores
          path: site/v1/municipios/cnpjs-fornecedores.txt
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: site-fornecedores
          path: site
          if-no-files-found: ignore
          retention-days: 3

  sondagem:
    # Só em PRs: confere se as fontes que não respondem ao GitHub continuam assim.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Sondar o pacote do SINAPI
        continue-on-error: true
        run: python -m araragov sinapi-sondar --mes 2025-06 | head -400
      - name: Sondar fontes municipais (alcance a partir do GitHub)
        continue-on-error: true
        run: scripts/coleta/sondar-fontes.sh

  montar:
    needs: [federal, base, siconfi, municipais, fornecedores]
    if: ${{ !cancelled() && !inputs.republicar }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          merge-multiple: true
          path: site
      - name: Conferir o que veio
        # Sem os perfis federais o app não abre; melhor não publicar por cima da versão anterior.
        run: |
          test -f site/v1/politicos.json || test -d site/v1/politicos || { echo "::error::faltou a parte federal"; exit 1; }
      - name: Tamanho da API
        # O GitHub Pages aceita sites de até 1 GB.
        run: |
          du -sh site site/v1/politicos site/v1/votacoes site/v1/municipios || true
          tamanho=$(du -sm site | cut -f1)
          if [ "$tamanho" -gt 900 ]; then echo "::warning::API com ${tamanho} MB, perto do limite de 1 GB do GitHub Pages"; fi
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          path: site

  publicar:
    # Publica a API estática no GitHub Pages: https://githyot.github.io/AraraGov/v1/
    # Só a partir do main; execuções manuais em outros ramos servem para testar.
    # Publica mesmo que uma fonte tenha falhado: montar só passa com a parte federal no lugar.
    # (Sem !cancelled(), uma fonte com erro em qualquer job anterior pulava a publicação.)
    if: ${{ !cancelled() && needs.montar.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  republicar:
    # Publica o site montado por outra execução (ex.: quando só a publicação falhou),
    # sem coletar de novo. O artefato github-pages fica guardado por um dia.
    if: ${{ inputs.republicar && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.republicar }}
          github-token: ${{ github.token }}
          path: pacote
      - run: mkdir site && tar -xf pacote/artifact.tar -C site && du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
